name: threadwork
x-agent: &agent
  image: threadwork-agent:local
  build:
    context: .
    dockerfile: docker/Dockerfile.agent
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  pids_limit: 512
  shm_size: 256mb
  healthcheck:
    test:
      [
        CMD,
        node,
        -e,
        "process.exit(Date.now()-require('node:fs').statSync('/state/state.json').mtimeMs<60000?0:1)",
      ]
    interval: 15s
    timeout: 3s
    start_period: 40s
    retries: 3
  depends_on:
    server:
      condition: service_healthy
services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run npm run setup first}
      AGENT_SPARK_TOKEN: ${AGENT_SPARK_TOKEN:?Run npm run setup first}
      AGENT_SAGE_TOKEN: ${AGENT_SAGE_TOKEN:?Run npm run setup first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - server-data:/data
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8082}:80"
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      server:
        condition: service_healthy
  spark:
    <<: *agent
    environment:
      THREADWORK_URL: http://server:3001
      AGENT_TOKEN: ${AGENT_SPARK_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - spark-data:/state
  sage:
    <<: *agent
    environment:
      THREADWORK_URL: http://server:3001
      AGENT_TOKEN: ${AGENT_SAGE_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - sage-data:/state
  agent:
    <<: *agent
    profiles: [manual]
    environment:
      THREADWORK_URL: ${THREADWORK_URL:-http://server:3001}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - custom-agent-data:/state
volumes:
  server-data:
  spark-data:
  sage-data:
  custom-agent-data:
    name: threadwork_${AGENT_VOLUME:-custom}
